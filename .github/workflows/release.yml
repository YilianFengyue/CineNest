name: Release & Nightly Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, e.g. v1.0.0 or nightly-test"
        required: false
        type: string
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cine_nest_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p ../dist
          apk_path="$(find . .. -path '*/outputs/flutter-apk/app-release.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "app-release.apk not found"
            exit 1
          fi
          cp "$apk_path" "../dist/CineNest-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/CineNest-android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-android
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Decide release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            prerelease="false"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            tag="${{ github.event.inputs.tag_name }}"
            prerelease="false"
          else
            tag="nightly-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
            prerelease="true"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        shell: bash
        run: |
          args=(--title "$RELEASE_TAG" --notes "Automated CineNest build.")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/**/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/**/* "${args[@]}"
          fi

name: cine_nest
description: "CineNest — AI 驱动的个性化影视推荐 App（手机端）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

# ─────────────────────────────────────────────────────────────
# 依赖说明：基建层全部仿照 PiliPlus 母版精选而来。
#   · 业务无关的通用基建保留（GetX / Dio / Hive / 主题 / 播放器 / WebView）
#   · B站强相关依赖（弹幕 canvas_danmaku、极验 gt3、gRPC/protobuf、webdav 等）已剔除
# 详见 docs/项目说明-快速上手.md
# ─────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理 + 路由 + 依赖注入（一把梭）
  get: ^4.7.2

  # 网络层
  dio: ^5.7.0
  dio_http2_adapter: ^2.7.1
  http2: ^2.3.0
  connectivity_plus: ^6.1.0
  cookie_jar: ^4.0.8

  # 解压（与母版一致，Http2Adapter 不自动解压）
  archive: ^3.6.1
  brotli: ^0.6.0
  crypto: ^3.0.5

  # 本地存储
  hive_ce: ^2.11.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # 主题 / 图片
  dynamic_color: ^1.7.0
  cached_network_image: ^3.4.1

  # 设置页分组列表（与 Kazumi 一致，照搬其 my_page / theme 设置）
  card_settings_ui: ^2.0.1
  # HCT 色彩空间（配色方案 PaletteCard 用，版本跟随 Flutter SDK 锁定）
  material_color_utilities: 0.11.1

  # 通用弹窗 / Toast / Loading
  flutter_smart_dialog: ^4.9.8

  # AI 对话 UI（成员 C · F9）—— Flyer Chat v2 全家桶
  flutter_chat_ui: ^2.11.1
  flutter_chat_core: ^2.9.0
  flyer_chat_text_message: ^2.6.0
  # WebSocket（接后端 /ws/chat 流式 Agent）
  web_socket_channel: ^3.0.1
  # flutter_chat_ui 内部状态注入用（读 ComposerHeightNotifier）
  provider: ^6.1.5
  # 文件 / 图片选择（对话附件上传，预留）
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  # 海报导出长图分享（F8）
  screenshot: ^3.0.0
  share_plus: ^10.1.4

  # 日志
  logger: ^2.4.0

  # 视频播放（成员 A）
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # 播放器周边（player_kazumi —— Kazumi 体验对齐）
  audio_video_progress_bar: ^2.0.2     # 进度条
  flutter_volume_controller: ^2.0.1    # 系统音量手势
  screen_brightness_platform_interface: ^2.1.0
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.2
  audio_service: ^0.18.15              # 后台播放/锁屏控件
  audio_session: ^0.2.2
  saver_gallery: ^4.1.0                # 截图保存到相册
  floating: ^4.0.1                     # Android 画中画
  window_manager: ^0.5.1               # 桌面端窗口/全屏

  # WebView 降级方案（成员 A）
  flutter_inappwebview: ^6.1.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
